version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - unconvert
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test helpers use fixed local addresses, random suffixes and
      # deliberately unchecked cleanup.
      - path: _test\.go
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
