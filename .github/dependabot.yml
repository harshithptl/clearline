# Weekly dependency updates. Minor and patch bumps are grouped into one PR
# per ecosystem; majors come separately so they can be reviewed on their own.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/engine]
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directories: [/deploy/compose]
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/web, /deploy/docker]
    schedule:
      interval: weekly
