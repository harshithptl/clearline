# Weekly dependency updates. Minor and patch bumps are grouped into one PR
# per ecosystem; majors come separately so they can be reviewed on their own.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/engine]
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directories: [/deploy/compose]
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript < 6.1; revisit when it adds 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types track the Node major we build and test on (web/.nvmrc: 24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: [/web, /deploy/docker]
    schedule:
      interval: weekly
    ignore:
      # Node majors move with web/.nvmrc and CI, deliberately.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # nginx odd minors (1.31, 1.33, ...) are the mainline branch; track stable.
      - dependency-name: nginxinc/nginx-unprivileged
        versions: ["1.31.x", "1.33.x", "1.35.x"]
