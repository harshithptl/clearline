name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a branch cancels its older, now pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (tags can be moved); Dependabot
# keeps them current.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  # Generated gRPC code is committed; fail if it no longer matches proto/.
  proto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/gen-proto.sh
      - name: generated code up to date
        run: |
          if [ -n "$(git status --porcelain gen/)" ]; then
            git status --porcelain gen/
            git diff gen/
            echo "::error::gen/ is stale: run scripts/gen-proto.sh and commit"
            exit 1
          fi

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: C++ build + gtest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: engine/Dockerfile
          target: test
          cache-from: type=gha,scope=engine
          cache-to: type=gha,scope=engine,mode=max

  # Go tests against real Postgres, Kafka, Valkey and the C++ engine.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: engine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: engine/Dockerfile
          target: runtime
          tags: clearline-engine:dev
          load: true
          cache-from: type=gha,scope=engine
      - name: start stack
        run: docker compose -f deploy/compose/docker-compose.yml up -d --wait
      - run: go run ./cmd/migrate
      - run: go run ./cmd/topics
      - name: go test
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic
      - name: coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: stack logs
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail=200

  # The whole stack in compose, driven from outside: REST in, ledger, outbox,
  # balances and reconciler checked (test/e2e).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: engine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: engine/Dockerfile
          target: runtime
          tags: clearline-engine:dev
          load: true
          cache-from: type=gha,scope=engine
      - name: services image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/services.Dockerfile
          tags: clearline:dev
          load: true
          cache-from: type=gha,scope=services
          cache-to: type=gha,scope=services,mode=max
      - name: start stack
        run: docker compose -f deploy/compose/docker-compose.yml --profile app up -d --wait
      - name: e2e
        run: go test -tags e2e -count=1 -v ./test/e2e
      - name: stack logs
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml --profile app logs --no-color --tail=200
