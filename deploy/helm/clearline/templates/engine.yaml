{{- $full := include "clearline.fullname" . -}}
# C++ matching engine (gRPC). State is in memory, per session; the matcher
# adapter rebuilds it by replaying the orders topic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-engine
  labels: {{- include "clearline.labels" . | nindent 4 }}
    app.kubernetes.io/name: engine
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "clearline.selector" (dict "root" . "name" "engine") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "clearline.labels" . | nindent 8 }}
        app.kubernetes.io/name: engine
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: engine
          image: {{ .Values.images.engine.repository }}:{{ .Values.images.engine.tag }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports: [{name: grpc, containerPort: 50051}]
          readinessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 3
          livenessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 10
          {{- include "clearline.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml .Values.engine.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-engine
  labels: {{- include "clearline.labels" . | nindent 4 }}
spec:
  selector: {{- include "clearline.selector" (dict "root" . "name" "engine") | nindent 4 }}
  ports: [{name: grpc, port: 50051, targetPort: grpc}]
