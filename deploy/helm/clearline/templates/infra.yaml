{{- if .Values.infra.enabled }}
{{- $full := include "clearline.fullname" . -}}
{{- $sc := .Values.infra.storageClassName -}}
# In-cluster infrastructure for kind/dev. Same durability settings as compose.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $full }}-postgres
  labels: {{- include "clearline.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  serviceName: {{ $full }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "clearline.selector" (dict "root" . "name" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "clearline.labels" . | nindent 8 }}
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.infra.postgres.image }}
          args: ["-c", "synchronous_commit=on", "-c", "fsync=on"]
          env:
            - {name: POSTGRES_USER, value: {{ .Values.database.user | quote }}}
            - {name: POSTGRES_DB, value: {{ .Values.database.name | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "clearline.secretName" . }}, key: POSTGRES_PASSWORD}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", {{ .Values.database.user | quote }}, "-d", {{ .Values.database.name | quote }}]}
            periodSeconds: 3
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 1Gi}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $sc }}
        storageClassName: {{ $sc }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.infra.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-postgres
  labels: {{- include "clearline.labels" . | nindent 4 }}
spec:
  selector: {{- include "clearline.selector" (dict "root" . "name" "postgres") | nindent 4 }}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
# Single KRaft broker (broker + controller). With one broker, acks=all means
# "this broker has it" (docs/decisions/0001-single-broker-durability.md).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $full }}-kafka
  labels: {{- include "clearline.labels" . | nindent 4 }}
    app.kubernetes.io/name: kafka
spec:
  serviceName: {{ $full }}-kafka
  replicas: 1
  selector:
    matchLabels: {{- include "clearline.selector" (dict "root" . "name" "kafka") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "clearline.labels" . | nindent 8 }}
        app.kubernetes.io/name: kafka
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: {{ .Values.infra.kafka.image }}
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: {{ printf "PLAINTEXT://%s-kafka:9092" $full | quote }}}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_MIN_INSYNC_REPLICAS, value: "1"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
          ports: [{name: kafka, containerPort: 9092}]
          readinessProbe:
            tcpSocket: {port: kafka}
            periodSeconds: 3
          resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {memory: 1536Mi}}
          volumeMounts: [{name: data, mountPath: /var/lib/kafka/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $sc }}
        storageClassName: {{ $sc }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.infra.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-kafka
  labels: {{- include "clearline.labels" . | nindent 4 }}
spec:
  selector: {{- include "clearline.selector" (dict "root" . "name" "kafka") | nindent 4 }}
  ports: [{name: kafka, port: 9092, targetPort: kafka}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $full }}-valkey
  labels: {{- include "clearline.labels" . | nindent 4 }}
    app.kubernetes.io/name: valkey
spec:
  serviceName: {{ $full }}-valkey
  replicas: 1
  selector:
    matchLabels: {{- include "clearline.selector" (dict "root" . "name" "valkey") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "clearline.labels" . | nindent 8 }}
        app.kubernetes.io/name: valkey
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      containers:
        - name: valkey
          image: {{ .Values.infra.valkey.image }}
          # fsync before acknowledging each write (see compose for why).
          args: ["valkey-server", "--appendonly", "yes", "--appendfsync", "always"]
          ports: [{name: valkey, containerPort: 6379}]
          readinessProbe:
            exec: {command: ["valkey-cli", "ping"]}
            periodSeconds: 3
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 512Mi}}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $sc }}
        storageClassName: {{ $sc }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.infra.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-valkey
  labels: {{- include "clearline.labels" . | nindent 4 }}
spec:
  selector: {{- include "clearline.selector" (dict "root" . "name" "valkey") | nindent 4 }}
  ports: [{name: valkey, port: 6379, targetPort: valkey}]
{{- end }}
