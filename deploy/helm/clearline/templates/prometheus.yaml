{{- if .Values.prometheus.enabled }}
{{- $full := include "clearline.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-prometheus
  labels: {{- include "clearline.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files: [/etc/prometheus/alerts.yml]
    scrape_configs:
      {{- range $job, $port := dict "gateway" 8080 "matcher-adapter" 9101 "settlement" 9102 "outbox-relay" 9103 "balance" 8081 "reconciler" 8082 }}
      - job_name: {{ $job }}
        static_configs: [{targets: [{{ printf "%s-%s:%v" $full $job $port | quote }}]}]
      {{- end }}
  # Copied from deploy/prometheus/alerts.yml by `make helm-sync` (CI checks they match).
  alerts.yml: |
    {{- .Files.Get "files/alerts.yml" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-prometheus
  labels: {{- include "clearline.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {{- include "clearline.selector" (dict "root" . "name" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "clearline.labels" . | nindent 8 }}
        app.kubernetes.io/name: prometheus
      annotations:
        # Restart on rule or settings changes (scrape targets follow the release name).
        checksum/config: {{ print (.Files.Get "files/alerts.yml") (toJson .Values.prometheus) | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
          ports: [{name: http, containerPort: 9090}]
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
          {{- include "clearline.containerSecurity" . | nindent 10 }}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: {{ $full }}-prometheus}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-prometheus
  labels: {{- include "clearline.labels" . | nindent 4 }}
spec:
  selector: {{- include "clearline.selector" (dict "root" . "name" "prometheus") | nindent 4 }}
  ports: [{name: http, port: 9090, targetPort: http}]
{{- end }}
