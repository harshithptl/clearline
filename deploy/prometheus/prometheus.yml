# Scrapes every Clearline service (compose service names; one target each).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    static_configs: [{targets: ["gateway:8080"]}]
  - job_name: matcher-adapter
    static_configs: [{targets: ["matcher-adapter:9101"]}]
  - job_name: settlement
    static_configs: [{targets: ["settlement:9102"]}]
  - job_name: outbox-relay
    static_configs: [{targets: ["outbox-relay:9103"]}]
  - job_name: balance
    static_configs: [{targets: ["balance:8081"]}]
  - job_name: reconciler
    static_configs: [{targets: ["reconciler:8082"]}]
