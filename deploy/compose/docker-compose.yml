# Shared settings for the Clearline services below (YAML anchors; compose
# ignores top-level keys starting with x-).
x-app: &app
  image: clearline:dev
  pull_policy: never # built locally by the migrate service below
  profiles: [app]
  restart: unless-stopped
  environment:
    CLEARLINE_DATABASE_URL: postgres://clearline:clearline@postgres:5432/clearline?sslmode=disable
    CLEARLINE_KAFKA_BROKERS: kafka:19092
    CLEARLINE_REDIS_ADDR: valkey:6379
    CLEARLINE_MATCHER_ADDR: engine:50051
    # Gateway and matcher adapter must agree on symbols. E2E and WEB are books
    # used only by test/e2e and web/e2e, so their orders never meet manual ones.
    CLEARLINE_SYMBOLS: AAPL:USD:0.01:150,MSFT:USD:0.01:400,TSLA:USD:0.01:250,NVDA:USD:0.01:500,E2E:USD:0.01:100,WEB:USD:0.01:50

x-after-init: &after-init
  migrate: {condition: service_completed_successfully}
  topics: {condition: service_completed_successfully}
  postgres: {condition: service_healthy}
  kafka: {condition: service_healthy}
  valkey: {condition: service_healthy}

services:
  postgres:
    image: postgres:16
    # Durability is non-negotiable (CLAUDE.md). These are the defaults, pinned explicitly.
    command: ["postgres", "-c", "synchronous_commit=on", "-c", "fsync=on"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearline -d clearline"]
      interval: 2s
      timeout: 3s
      retries: 15
    environment:
      POSTGRES_USER: clearline
      POSTGRES_PASSWORD: clearline
      POSTGRES_DB: clearline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Single Kafka broker in KRaft mode (no ZooKeeper): it is both broker and controller.
  # Two client listeners:
  #   INTERNAL kafka:19092     for other containers (services, later)
  #   EXTERNAL localhost:9092  for tests and tools on the host
  # With one broker, replication factor and min.insync.replicas are 1, so acks=all
  # means "the one broker has it". See docs/decisions/0001-single-broker-durability.md.
  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created explicitly by cmd/topics, never by a typo in a producer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 10s
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data

  # Valkey: open-source Redis fork, wire compatible. Used for idempotency keys
  # (gateway) and the balance cache (balance service).
  # appendfsync always: fsync before acknowledging each write. The balance
  # consumer commits Kafka offsets after Valkey acks, so a write lost on crash
  # would never be redelivered (and gateway idempotency keys must not vanish).
  valkey:
    image: valkey/valkey:9.1.3-alpine
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "always"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data

  # C++ matching engine over gRPC (engine/). State is in memory, per session;
  # the matcher adapter rebuilds it by replaying the orders topic.
  engine:
    build:
      context: ../..
      dockerfile: engine/Dockerfile
      target: runtime
    image: clearline-engine:dev
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/50051"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "50051:50051"

  # ---- Clearline services (profile "app") --------------------------------
  # `make up` starts only the infrastructure above (what `go test` needs).
  # `make up-all` adds these, all from one image (deploy/docker/services.Dockerfile).
  # Startup order: infra healthy -> migrate + topics complete -> services.

  # Builds the shared image (once); every other service reuses it.
  migrate:
    <<: *app
    build:
      context: ../..
      dockerfile: deploy/docker/services.Dockerfile
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  topics:
    <<: *app
    command: ["topics"]
    restart: "no"
    depends_on:
      kafka: {condition: service_healthy}

  gateway:
    <<: *app
    command: ["gateway"]
    ports: ["8080:8080"]
    stop_grace_period: 15s # in-flight requests finish their Kafka write
    healthcheck:
      test: ["CMD", "healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on: *after-init

  # Exits on any engine or Kafka error by design; the restart policy is the
  # recovery path (replay, docs/decisions/0002-matcher-replay.md).
  matcher-adapter:
    <<: *app
    command: ["matcher-adapter"]
    depends_on:
      <<: *after-init
      engine: {condition: service_healthy}

  settlement:
    <<: *app
    command: ["settlement"]
    depends_on: *after-init

  outbox-relay:
    <<: *app
    command: ["outbox-relay"]
    depends_on: *after-init

  balance:
    <<: *app
    command: ["balance"]
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "healthcheck", "http://127.0.0.1:8081/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on: *after-init

  reconciler:
    <<: *app
    command: ["reconciler"]
    ports: ["8082:8082"]
    healthcheck:
      test: ["CMD", "healthcheck", "http://127.0.0.1:8082/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on: *after-init

  # Dashboard (web/): static React build behind nginx, which also proxies
  # /api/* to the services. Open http://localhost:3000.
  web:
    image: clearline-web:dev
    build:
      context: ../../web
    profiles: [app]
    restart: unless-stopped
    ports: ["3000:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      gateway: {condition: service_healthy}
      balance: {condition: service_healthy}
      reconciler: {condition: service_healthy}

  # Prometheus scrapes every service's /metrics and evaluates the alert rules
  # (deploy/prometheus). UI and query API on http://localhost:9090.
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [app]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports: ["9090:9090"]
    volumes:
      - ../prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  promdata:
  pgdata:
  kafkadata:
  valkeydata:
